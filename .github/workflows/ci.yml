name: CI

# Triggers: every push to master AND every pull request targeting master
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore HolidayApi.sln

      - name: Build
        run: dotnet build HolidayApi.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test HolidayApi.sln --no-build --configuration Release --verbosity normal
